{{ textarea }}

{% with html_id|add:"_config" as config_id %}{{ config|json_script:config_id }}{% endwith %}
<script>
  {# this tells CKEditor where to find its static assets #}
  CKEDITOR_BASEPATH = "{{ ckeditor_path|escapejs }}";
  if(window.CKEDITOR)
    CKEDITOR.basePath = CKEDITOR_BASEPATH;

  (function (load) {
    {# only require CKEDITOR if it hasn't already be loaded. This allows loading your own ckeditor. #}
    if ( typeof CKEDITOR === 'object' )
      load();
    else
      require(['lib/ckeditor/ckeditor'], load);
  })(function() {
    var html_id = "{{ html_id|escapejs }}";
    CKEDITOR.replace(html_id, JSON.parse(document.getElementById(html_id + "_config").textContent));
  });
</script>
