{% load thumbnail_libs %}
{% load widgy_tags %}

{% easy_thumbnail self.background_image.file 640x300 as im %}
<div class="slide" {% if im %}style="background-image: url('{{ im.url }}')"{% endif %}>

  <h1>{{ self.tagline }}</h1>

  {% for child in self.get_children %}
  {% render child %}
  {% endfor %}
</div>
