[project]
name = "django-widgy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "gwahl@fusionbox.com" },
    { email = "eabrahamsen@fusionbox.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "bleach>=6.4.0",
    "bleach-allowlist>=1.0.3",
    "dj-database-url>=2.2.0",
    "django>=3.1,<3.3",
    "django-compressor>=1.3",
    "django-filer>=3.6.0",
    "django-pyscss>=2.0.3",
    "django-treebeard>=4.7.1",
    "legacy-cgi>=2.6.4",
    "markdown>=3.11.2",
    "mezzanine>=6.1.1",
    "pyscss",
    "six>=1.17.0",
]

[project.scripts]
django-widgy = "django_widgy:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "python-lsp-server>=1.15.0",
]

# Redundant with Makefile test-py target
[tool.pytest]

DJANGO_SETTINGS_MODULE = "tests.settings_contrib"

[tool.uv.sources]
pyscss = { git = "https://github.com/Kronuz/pyScss.git" }

