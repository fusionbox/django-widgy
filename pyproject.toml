[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-widgy"
version = "0.10.0"
description = "A CMS framework for Django built on a heterogenous tree editor."
readme = "README.rst"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Fusionbox, Inc.", email = "programmers@fusionbox.com" },
]
maintainers = [
    { email = "gwahl@fusionbox.com" },
    { email = "eabrahamsen@fusionbox.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Natural Language :: English",
    "Programming Language :: JavaScript",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "bleach>=6.4.0",
    "bleach-allowlist>=1.0.3",
    "dj-database-url>=2.2.0",
    "django>=4.1,<4.3",
    "django-compressor>=1.3",
    "django-filer>=3.6.0",
    "django-pyscss>=2.0.3",
    "django-treebeard>=4.7.1",
    "html2text>=2025.4.15",
    "html5lib>=1.1",
    "markdown>=3.11.2",
    "mezzanine>=6.1.1",
    "phonenumbers>=9.0.42",
    "pyscss",
    "sorl-thumbnail==12.10.0",
]

[project.urls]
Homepage = "http://docs.wid.gy/"
Source = "https://github.com/fusionbox/django-widgy"

# Every contrib app's requirements are now hard dependencies. The extras are
# kept as empty aliases so that `pip install django-widgy[all]` and the
# per-app spellings used in older docs and tox.ini keep working.
[project.optional-dependencies]
all = []
widgy_mezzanine = []
page_builder = []
form_builder = []

[tool.setuptools.packages.find]
include = ["widgy*"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "django-debug-toolbar",
    "django-extensions",
    "python-lsp-server>=1.15.0",
]
demo = [
    "werkzeug",
    "django-contrib-comments",
]

# Redundant with Makefile test-py target
[tool.pytest]
DJANGO_SETTINGS_MODULE = "tests.settings_contrib"

[tool.uv.sources]
pyscss = { git = "https://github.com/Kronuz/pyScss.git" }

